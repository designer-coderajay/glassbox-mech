name: Publish to PyPI

# Triggers on any tag that starts with "v" (e.g. v2.6.0, v3.0.0).
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored in GitHub, and
# the upload carries PEP 740 attestations. One-time setup on PyPI, done by the owner:
#   1. https://pypi.org/manage/project/glassbox-mech-interp/settings/publishing/
#   2. Add a new publisher -> GitHub:
#        Owner:            designer-coderajay
#        Repository name:  glassbox-mech
#        Workflow name:    publish.yml
#        Environment name: pypi
#   3. After the first successful release with it, delete the old PYPI_API_TOKEN
#      secret in GitHub and revoke that token on PyPI.

on:
  push:
    # Only trigger on versioned package tags (e.g. v3.0.0, v3.1.0)
    # Excludes action-only tags like v1, v2 which don't carry a new package version
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine --quiet

      - name: Sync version strings across all files
        run: python3 scripts/sync_versions.py --apply

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify metadata (twine check)
        run: python -m twine check dist/*

      - name: Show what was built
        run: ls -lh dist/

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      id-token: write   # Trusted Publishing (OIDC) and attestation signing

    environment:
      name: pypi
      url: https://pypi.org/p/glassbox-mech-interp

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Publish to PyPI (Trusted Publishing, with attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true   # gracefully skip if this version already exists on PyPI
