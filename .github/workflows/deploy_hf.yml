name: Deploy to HuggingFace Space

# ──────────────────────────────────────────────────────────────────────────────
# Syncs dashboard/app.py + glassbox library → HuggingFace Space on push to main.
# Uses huggingface_hub Python API (upload_folder) — no git LFS needed.
#
# One-time setup required:
#   1. Go to https://huggingface.co/settings/tokens
#   2. Create a token with "write" scope
#   3. Go to GitHub repo → Settings → Secrets and variables → Actions
#   4. Add secret named:  HF_TOKEN  (paste the HF token)
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - "dashboard/app.py"
      - "dashboard/space_ui.py"
      - "dashboard/v7_investigation.py"
      - "dashboard/v7_agent_demo.py"
      - "glassbox/**"
      - ".github/workflows/deploy_hf.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Sync to HuggingFace Space
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        # Pin <0.26.0: HfFolder was removed in 0.26.0, breaking gradio 4.x oauth.
        # Until the Space upgrades to gradio 5.x, keep hub pinned here AND in Space requirements.
        run: pip install "huggingface_hub>=0.22.0,<0.26.0" --quiet

      - name: Check HF_TOKEN availability
        id: token-check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::notice::HF_TOKEN not set — skipping HuggingFace deploy."
          fi

      - name: Sync version strings across all files
        run: python3 scripts/sync_versions.py --apply

      - name: Build Space payload
        if: steps.token-check.outputs.available == 'true'
        run: |
          mkdir -p hf_payload
          cp dashboard/app.py hf_payload/app.py
          cp dashboard/space_ui.py hf_payload/space_ui.py
          cp dashboard/v7_investigation.py hf_payload/v7_investigation.py
          cp dashboard/v7_agent_demo.py hf_payload/v7_agent_demo.py

          SHORT_SHA=$(git rev-parse --short HEAD)

          # Exact pins = the stack CI tests with (ci.yml) + gradio from sdk_version below.
          # Unpinned installs broke the Space before (pyarrow needing NumPy 2), so every
          # direct dependency is pinned. torch comes from the CPU wheel index (smaller).
          cat > hf_payload/requirements.txt << 'REQS'
          --extra-index-url https://download.pytorch.org/whl/cpu
          torch==2.10.0
          numpy==1.26.4
          scipy==1.17.1
          einops==0.8.2
          transformer-lens==2.17.0
          transformers==4.57.6
          pyarrow==23.0.0
          datasets==4.5.0
          glassbox-mech-interp==4.6.1
          REQS

          cat > hf_payload/README.md << RDME
          ---
          title: Glassbox
          emoji: 🔬
          colorFrom: red
          colorTo: yellow
          sdk: gradio
          sdk_version: "5.50.0"
          python_version: "3.11"
          app_file: app.py
          pinned: true
          short_description: Find the circuit behind a prediction and test it
          startup_duration_timeout: 1h
          models:
            - openai-community/gpt2
          preload_from_hub:
            - gpt2 config.json,model.safetensors,tokenizer.json,vocab.json,merges.txt,tokenizer_config.json,generation_config.json
          tags:
            - interpretability
            - mechanistic-interpretability
            - explainability
            - transformer-lens
            - eu-ai-act
          license: other
          ---

          # Glassbox

          Find which attention heads drive a transformer's prediction, then measure how
          faithful that explanation is by ablating them. Live on GPT-2 small.

          - **Explain a prediction:** circuit, sufficiency, comprehensiveness, F1 and a grade.
          - **Layer by layer** and **Attention:** where the answer forms and what each head reads.
          - **Investigate a change** (research preview): which of several changes altered an AI system's behaviour, on a simulated tool-using agent and a GPT-2 RAG assistant.
          - **Annex IV draft:** evidence for EU AI Act technical documentation, with every field you must complete marked. Not legal advice.

          \`pip install glassbox-mech-interp\` · [Paper](https://arxiv.org/abs/2603.09988) ·
          [GitHub](https://github.com/designer-coderajay/glassbox-mech) ·
          [What is proven](https://github.com/designer-coderajay/glassbox-mech/blob/main/ASSURANCE.md)

          Licence: core MIT; compliance engine and investigation layer BSL 1.1 (see NOTICE in the repository).
          Version 4.6.1 · deployed from GitHub @ ${SHORT_SHA}
          RDME

          echo "Payload built — files:"
          ls -la hf_payload/

      - name: Upload to HuggingFace Space
        if: steps.token-check.outputs.available == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHORT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<PYEOF
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = "designer-coderajay/Glassbox-AI-2.0-Mechanistic-Interpretability-tool"

          api.upload_folder(
              folder_path="hf_payload",
              repo_id=repo_id,
              repo_type="space",
              commit_message=f"deploy: {os.environ.get('COMMIT_MSG','update')} @ {os.environ.get('SHORT_SHA','HEAD')[:7]}",
              ignore_patterns=["*.pyc", "__pycache__"],
          )
          print(f"Space updated: https://huggingface.co/spaces/{repo_id}")
          PYEOF
